<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- css를 편하게 사용할 수 있는 붓스트랩 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>signup</title>
    <style>
        .card{
            background:#fffafc;
        }

        h1{
            font-weight:bold;
        }

        .form-control:focus{
            border-color:#ff9ecf;
            box-shadow:0 0 0 .2rem rgba(255,158,207,.25);
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width:500px;">

    <h1 class="text-center mb-4 text-primary">🐱 회원가입</h1>

    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <form action="/signup" method="post" enctype="multipart/form-data">
                <div  class="mb-3">
                    <label> 아이디:
                    <input type="text" class="form-control" name="id" required>
                    </label>
                </div>
                <div  class="mb-3">
                    <label> 이메일:
                        <input type="email" class="form-control" name="email" id="email" required>
                    </label>
                    <button type="button" class="btn btn-outline-primary" onclick="sendEmailCode()">인증번호 발송</button>
                </div>
                <div  class="mb-3">
                    <label> 인증번호:
                        <input type="text" class="form-control" id="code" >
                    </label>
                    <button type="button"  class="btn btn-outline-primary" onclick="verifyEmailCode()">인증번호 확인</button>
                    <span id="verifyResult"></span>
                </div>
                <div  class="mb-3">
                    <label> 이름:
                        <input type="text" class="form-control" name="name" required>
                    </label>
                </div>
                <div class="mb-3">
                    <label> 비밀번호:
                        <input type="password" class="form-control" name="password" required>
                    </label>
                </div>
                <div class="mb-3">
                    <label> 프로필 이미지:
                        <!--
                        file 들 중에서 첨부 가능한 파일의 확장자 형태를 설정
                        image 파일을 우선적으로 가져올 수 있도록 허용
                        만약, image 파일 중에서 png 파일만 가져오겠다 하는 경우에는
                        <input type="file" name="profileImage" accept="image/png">


                        Cannot convert value of type 'org.springframework.web.multipart.support.StandardMultipartHttpServletRequest$StandardMultipartFile'
                        스프링에서 파일 데이터를 가져올때는 Member 필드의 작성한 변수이름과 html name 명칭을 다르게 작성해야된다.
                        -->
                        <input type="file"  class="form-control" name="profileImg" accept="image/*">
                    </label>
                </div>
                <!--btn = button에서 자음을 축소해서 버튼의 줄임말로 많이 사용-->
                <button type="reset" class="btn btn-outline-secondary">초기화</button>
                <button type="submit" class="btn btn-primary w-100 rounded-3">💖 회원가입</button>

            </form>
        </div>
    </div>


</div>


<!--
보통 link 태그의 경우 /head 태그가 닫히기 전에 넣어주고
script는 /body 태그가 닫히기 전에 넣어준다.

인터넷 브라우저는 html을 위에서부터 아래로 읽으면서 화면을 그려 나간다.
css가 없으면 화면에 어떻게 디자인을 적용할 지 모르기 때문에 head에서 css를 먼저 로딩하고 브라우저가 style 정보를 다 파악한 다음에
body내용을 디자인한다. 그리고 해당 디자인이 다 입혀진 html 화면이 소비자에 눈에 보이게 된다.

css를 body 아래 쪽에 넣으면, style이 렌더링할 때 어느순간 깨지는 현상이 발생한다. (디자인을 입힌 완성된 모습으로 한번에 보여주기 위해 css는 head에서 불러오는 것이 안전하다.)

<script를 body 끝에 넣는 이유>
js는 html 요소를 조작하는 경우가 많아서 body 태그의 각각의 요소들이 어디 존재하는지 파악한 후 요소들의 움직임이나 동작을 적용한다.
어디에 위치한 html 태그를 어떻게 동작해야할 때 사용한다.

<요소와 태그의 차이>
<div></div> - 단순태그
<div>안녕</div> - 단순태그 + 개발자가 표현하고자 하는 데이터 추가 = 요소

요소 = 태그 + 태그 내부에 존재하는 속성이나 개발자, 소비자가 작성한 데이터를 포함 한 것 까지 요소라고한다.



-->
<script>

    /*
     <input type="email" name="email" id="email" required>
     <button type="button" onclick="sendEmailCode()">인증번호 발송</button>

     인증번호 발송 버튼을 클릭하면 실행되는 함수이다.
     onclick = "sendEmailCode()" 로 연결되어있다.

     document.getElementById("email").value;
        - html에서 id="email" 인 input 태그를 찾아서, 사용자가 입력한 이메일 값을 가져온다.
        - document 웹 문서에서 id가 email인 요소를 찾는 자바스크립트 문법
        - .value는 id가 emial인 input에 입력된 값을 의미

     fetch는 자바스크립트에서 서버에 요청을 보내는 함수(=기능)
        /email/send?email=     백엔드 EmailController에 있는 @PostMapping("/email/send")로 요청을 보내면서
        email 파라미터에 사용자가 입력한 값을 함께 전달한다.

     encodeURIComponent(email) 이메일 안에 작성되어있는 @, .과 같은 특수문자가 URL 주소에서 깨지지 않도록 안전한 상태로 변환해주는 기능

     {method:"POST"} → GET 이 아니라 POST 식으로 요청한다는 옵션이다.
     컨트롤러에서도 반드시 @PostMapping 형식으로 맞추어야한다.

     res = 서버가 보낸 데이터가 들어있는 변수


    */

    function sendEmailCode(){
        const email = document.getElementById("email").value;
        fetch("/email/send?email="+encodeURIComponent(email),{method:"POST"})
            .then(res => res.text()) // 서버에서 전달한 텍스트를 받아서
            .then(msg => alert(msg)); // 소비자에서 msg라는 변수에 담아서 백엔드에서 전달한 데이터를 반환하는 것
        // (alert = 알림창으로 X 또는 확인 버튼을 클릭해야 닫을수있는 작은 팝업창)


    /*
    백엔드 - 프론트엔드 개발에서 확인할 때
    웹 F12 console 창을 열어 어디서 문제가 발생했는지 확인하


    */

    }
    function verifyEmailCode(){
        const email = document.getElementById("email").value;
        const code = document.getElementById("code").value;
        fetch("/email/verify?email="+encodeURIComponent(email)+"&code="+encodeURIComponent(code),{method:"POST"})
            .then(res => res.text())
            .then(msg =>  {
                document.getElementById("verifyResult").innerText =msg
            });


    }

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
</script>
</body>
</html>
