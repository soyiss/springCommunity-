<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- css를 편하게 사용할 수 있는 붓스트랩 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>signup</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>회원가입</h1>
    <form action="/signup" method="post">
        <div>
            <label> 아이디:
            <input type="text" name="id" required>
            </label>
        </div>
        <div>
            <label> 이메일:
                <input type="email" name="email" id="email" required>
            </label>
            <button type="button" onclick="sendEmailCode()">인증번호 발송</button>
        </div>
        <div>
            <label> 인증번호:
                <input type="text" id="code" >
            </label>
            <button type="button" onclick="verifyEmailCode()">인증번호 확인</button>
            <span id="verifyResult"></span>
        </div>
        <div>
            <label> 아이디:
                <input type="text" name="id" required>
            </label>
        </div>
        <div>
            <label> 이름:
                <input type="text" name="name" required>
            </label>
        </div>
        <div>
            <label> 비밀번호:
                <input type="password" name="password" required>
            </label>
        </div>
        <!--btn = button에서 자음을 축소해서 버튼의 줄임말로 많이 사용-->
        <button type="reset" class="btn btn-outline-secondary">초기화</button>
        <button type="submit" class="btn btn-primary">회원가입</button>

    </form>


</div>


<!--
보통 link 태그의 경우 /head 태그가 닫히기 전에 넣어주고
script는 /body 태그가 닫히기 전에 넣어준다.

인터넷 브라우저는 html을 위에서부터 아래로 읽으면서 화면을 그려 나간다.
css가 없으면 화면에 어떻게 디자인을 적용할 지 모르기 때문에 head에서 css를 먼저 로딩하고 브라우저가 style 정보를 다 파악한 다음에
body내용을 디자인한다. 그리고 해당 디자인이 다 입혀진 html 화면이 소비자에 눈에 보이게 된다.

css를 body 아래 쪽에 넣으면, style이 렌더링할 때 어느순간 깨지는 현상이 발생한다. (디자인을 입힌 완성된 모습으로 한번에 보여주기 위해 css는 head에서 불러오는 것이 안전하다.)

<script를 body 끝에 넣는 이유>
js는 html 요소를 조작하는 경우가 많아서 body 태그의 각각의 요소들이 어디 존재하는지 파악한 후 요소들의 움직임이나 동작을 적용한다.
어디에 위치한 html 태그를 어떻게 동작해야할 때 사용한다.

<요소와 태그의 차이>
<div></div> - 단순태그
<div>안녕</div> - 단순태그 + 개발자가 표현하고자 하는 데이터 추가 = 요소

요소 = 태그 + 태그 내부에 존재하는 속성이나 개발자, 소비자가 작성한 데이터를 포함 한 것 까지 요소라고한다.



-->
<script>
    function sendEmailCode(){
        const email = document.getElementById("email").value;
        fetch("/email/send?email="+encodeURIComponent(email),{method:"POST"})
            .then(res => res.text())
            .then(msg => alert(msg));


    }
    function verifyEmailCode(){
        const email = document.getElementById("email").value;
        const code = document.getElementById("code").value;
        fetch("/email/verify?email="+encodeURIComponent(email)+"&code="+encodeURIComponent(code),{method:"POST"})
            .then(res => res.text())
            .then(msg =>  {
                document.getElementById("verifyResult").innerText =msg
            });


    }

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
</script>
</body>
</html>
